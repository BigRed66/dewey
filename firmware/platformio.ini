; PlatformIO-Konfiguration für NodeMCU + RC522 RFID-Reader
;
; NodeMCU v2 (AI-Thinker / AZDelivery):
[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps  = miguelbalboa/MFRC522@^1.4.11

; NodeMCU v3 (LOLIN / WeMos) – gleiches Board-Target, nur anderer Hersteller:
; [env:nodemcuv3]
; platform  = espressif8266
; board     = nodemcuv2
; framework = arduino
; monitor_speed = 115200
; lib_deps  = miguelbalboa/MFRC522@^1.4.11
